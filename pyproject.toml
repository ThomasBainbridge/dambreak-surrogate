[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dambreak-surrogate"
version = "0.1.0"
description = "Automated OpenFOAM VOF dam-break database and surrogate models for obstacle impact loads."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Thomas Bainbridge" }]
keywords = [
    "computational-fluid-dynamics",
    "openfoam",
    "volume-of-fluid",
    "surrogate-modelling",
    "reduced-order-modelling",
]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.8",
    "scikit-learn>=0.23",
    "matplotlib>=3.5",
    "joblib>=0.17",
    "pillow>=9.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
# The pipeline is a set of scripts, not an importable package.
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
